name: Katabump Auto Renew

on:
  schedule:
    - cron: "0 0 */3 * *"   # هر ۳ روز یک‌بار (نیمه‌شب UTC)
  workflow_dispatch:          # اجرای دستی از تب Actions

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run renew script
        env:
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
        run: python renew.py
